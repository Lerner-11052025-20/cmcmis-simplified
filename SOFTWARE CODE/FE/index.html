<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F5F6FA" />

    <!--
      Inter font from Google Fonts. preconnect speeds up first paint;
      `display=swap` keeps text visible even if Fonts is slow. Falls
      back to the OS font stack (declared in tailwind.config.js) if
      Fonts is blocked by network policy.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>CMCMIS - Sign In</title>
  </head>
  <body>
    <!-- React mounts into #root; everything is client-side rendered. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
