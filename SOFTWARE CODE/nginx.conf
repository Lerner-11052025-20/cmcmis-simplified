# Nginx Configuration Template for CMCMIS Production Deployment
# ------------------------------------------------------------------------------
# Place this in /etc/nginx/conf.d/cmcmis.conf or /etc/nginx/nginx.conf

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com; # Replace with your actual domain or IP address

    # Redirect all HTTP traffic to HTTPS (highly recommended for production)
    # return 301 https://$host$request_uri;

    # Root directory of the built frontend static files
    root /var/www/cmcmis/fe/dist;
    index index.html;

    # Gzip Compression settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static frontend routes (Single Page Application fallback to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache control for static assets (JavaScript, CSS, Images, Fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to the Node.js Express backend server
    location /api {
        proxy_pass http://127.0.0.1:3000; # Address where Express backend is listening
        proxy_http_version 1.1;
        
        # Connection headers to allow WebSockets and keep-alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Pass client headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for large PDF downloads or chunked streams
        proxy_buffering off;
        proxy_read_timeout 90;
    }
}

